name: Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version_name:
        description: '自定义版本号 (例如 alpha0.0.1，留空则自动从 alpha0.0.1 开始堆号递增)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version
        id: versioning
        run: |
          git fetch --tags --force 2>/dev/null || true

          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            VERSION_CODE="${{ github.run_number }}"
          else
            # 获取已发布的最新 alpha0.0.x 标签
            LATEST_TAG=$(git tag -l "alpha0.0.*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              CURRENT_NUM=1
            else
              LATEST_NUM=$(echo "$LATEST_TAG" | sed 's/.*alpha0\.0\.//')
              CURRENT_NUM=$((LATEST_NUM + 1))
            fi
            VERSION_NAME="alpha0.0.${CURRENT_NUM}"
            VERSION_CODE="${CURRENT_NUM}"
          fi
          TAG_NAME="$VERSION_NAME"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          echo "====================================="
          echo "🚀 Target Version: $VERSION_NAME (Code: $VERSION_CODE)"
          echo "🏷️ Git Tag: $TAG_NAME"
          echo "====================================="

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK (Release & Debug)
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug \
            "-Dorg.gradle.java.home=$JAVA_HOME" \
            "-PversionCode=${{ env.VERSION_CODE }}" \
            "-PversionName=${{ env.VERSION_NAME }}" --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p release-apks
          # 复制并标准化 APK 命名
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-apks/Nocturn-${{ env.VERSION_NAME }}-release.apk"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-apks/Nocturn-${{ env.VERSION_NAME }}-debug.apk"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nocturn-${{ env.VERSION_NAME }}
          path: release-apks/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Nocturn ${{ env.TAG_NAME }}"
          files: release-apks/*
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
