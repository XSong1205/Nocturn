name: Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK & NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 "platforms;android-37" "ndk;28.2.13676358" "cmake;3.22.1" || "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1" || true
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read Version from Repository
        id: versioning
        run: |
          VERSION_NAME=$(grep '^versionName=' app/version.properties | cut -d'=' -f2 | tr -d '\r\n ')
          VERSION_CODE=$(grep '^versionCode=' app/version.properties | cut -d'=' -f2 | tr -d '\r\n ')

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/version.properties"
            exit 1
          fi

          if [[ "$VERSION_NAME" == v* ]]; then
            TAG_NAME="$VERSION_NAME"
          else
            TAG_NAME="v$VERSION_NAME"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          echo "========================================="
          echo "📦 Target Version: $VERSION_NAME ($VERSION_CODE)"
          echo "🏷️ Git Tag: $TAG_NAME"
          echo "========================================="

      - name: Clean Windows Specific Java Config
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/*.apk release-apks/
          echo "Found APKs:"
          ls -lh release-apks/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nocturn-${{ env.TAG_NAME }}
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ env.TAG_NAME }}" "${{ github.sha }}"
          git push origin "${{ env.TAG_NAME }}" --force

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Nocturn ${{ env.TAG_NAME }}"
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
